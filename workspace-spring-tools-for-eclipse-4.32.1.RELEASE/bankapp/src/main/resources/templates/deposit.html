<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"/><title>Deposit</title></head>
<body>
  <h2>Deposit for account <span th:text="${txDto.accountNumber}"></span></h2>
  <form th:action="@{/accounts/deposit}" th:object="${txDto}" method="post">
    <input type="hidden" th:field="*{accountNumber}" />
    <div>
      <label>Amount</label>
      <input th:field="*{amount}" />
      <div th:if="${#fields.hasErrors('amount')}" th:errors="*{amount}"></div>
    </div>
    <button type="submit">Deposit</button>
  </form>
  <p><a th:href="@{|/accounts/dashboard?acc=${txDto.accountNumber}|}">Back</a></p>
</body>
</html>
